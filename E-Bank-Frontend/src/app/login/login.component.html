<!-- Main container -->
<div class="main-con">
  <div class="login-theme-bar">
    <app-theme-toggle [compact]="true"></app-theme-toggle>
  </div>
  <!-- Content container -->
  <div class="ct-con">
    <!-- Image container -->
    <div class="im-con">
      <img src="assets/img/banking illustration.png" alt="banking illustration" class="ima">
    </div>
    <!-- Form container -->
    <div class="form-el">
      <h1>Welcome Back!</h1>
      <form [formGroup]="formLogin" (ngSubmit)="handleLogin()">
        <div class="inp-con">
          <label class="lab">Email or username</label>
          <input type="text" class="inp" [class.error-input]="usernameControl?.invalid && usernameControl?.touched"
            placeholder="mohamed or mohamed@example.com" formControlName="username" autocomplete="username">
          <span class="error-msg" *ngIf="usernameControl?.invalid && usernameControl?.touched">
            Email or username is required
          </span>
        </div>
        <div class="inp-con">
          <label class="lab">Password</label>
          <input type="password" class="inp" [class.error-input]="passwordControl?.invalid && passwordControl?.touched"
            placeholder="username + 123" formControlName="password" autocomplete="current-password">
          <span class="error-msg" *ngIf="passwordControl?.invalid && passwordControl?.touched">
            Password is required
          </span>
        </div>
        <!-- General error message -->
        <div class="error-container" *ngIf="errorMessage">
          <span class="error-msg">{{ errorMessage }}</span>
        </div>
        <p class="demo-hint">Demo: <code>mohamed</code> / <code>mohamed123</code></p>
        <button type="submit" class="but" [disabled]="isLoading">
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Logging in...</span>
        </button>
      </form>
    </div>
  </div>
</div>
